[package]
name = "lumen-shell"
version = "1.0.0"
edition = "2021"
description = "Tauri host for the Lumen interface: tray, global shortcuts and the command surface"
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lumen-core = { version = "0.1.0", path = "../crates/core" }
lumen-stability = { version = "0.1.0", path = "../crates/stability" }
lumen-translate = { version = "0.1.0", path = "../crates/translate" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
