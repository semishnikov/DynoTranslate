[package]
name = "lumen-shell"
version = "1.0.0"
edition = "2021"
description = "Tauri host for the Lumen interface: tray, global shortcuts and the command surface"
license = "Apache-2.0"
publish = false

# Deliberately not a workspace member: the CI toolchain has no WebKit/GTK packages and
# cannot be changed without the workflows permission (docs/WORKFLOW.md). Build this on a
# desktop machine with `cargo tauri build` from the repository root tooling.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lumen-core = { path = "../crates/core" }
lumen-stability = { path = "../crates/stability" }
lumen-translate = { path = "../crates/translate" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
