name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Run the headless pipeline
        run: cargo run --release --bin lumen-pipeline -- --scene menu --out-dir pipeline-out

      - name: Upload the pipeline output
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-${{ matrix.os }}
          path: pipeline-out
          retention-days: 14

      # The development environment cannot reach the Actions log host, so a failing run restates
      # what it found as check annotations, which are readable through the repository API.
      - name: Report what failed
        if: failure()
        shell: bash
        run: |
          set +e
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cargo fmt --all --check > fmt.txt 2>&1
            sed -n '1,40p' fmt.txt | while IFS= read -r line; do
              printf '::error title=fmt::%s\n' "${line//'%'/'%25'}"
            done
          fi
          cargo clippy --workspace --all-targets --message-format short -- -D warnings > clippy.txt 2>&1
          grep -E "(^|: )(error|warning)" clippy.txt > diag.txt
          if [ ! -s diag.txt ]; then
            tail -n 30 clippy.txt > diag.txt
          fi
          sed -n '1,40p' diag.txt | while IFS= read -r line; do
            printf '::error title=clippy::%s\n' "${line//'%'/'%25'}"
          done
          test_needed=1
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ -s fmt.txt ]; then
            test_needed=0
          fi
          if grep -qE "(^|: )(error|warning)" clippy.txt; then
            test_needed=0
          fi
          if [ "$test_needed" = "1" ]; then
            cargo test --workspace --all-targets > test.txt 2>&1
            { grep -E "^test result: FAILED" test.txt; grep -E "^error" test.txt; grep -E "^    [a-zA-Z0-9_:]+$" test.txt; grep -E "FAILED$" test.txt; } > testdiag.txt
            sed -n '1,40p' testdiag.txt | while IFS= read -r line; do
              printf '::error title=test-diag::%s\n' "${line//'%'/'%25'}"
            done
            if [ ! -s testdiag.txt ]; then
              if ! cargo run --release --bin lumen-pipeline -- --scene menu --out-dir pipeline-out > pipeline.txt 2>&1; then
                tail -n 20 pipeline.txt > pipediag.txt
                sed -n '1,40p' pipediag.txt | while IFS= read -r line; do
                  printf '::error title=pipeline-diag::%s\n' "${line//'%'/'%25'}"
                done
              fi
            fi
          fi

  web:
    name: Interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build
